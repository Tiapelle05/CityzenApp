server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno di Docker, serve per risolvere "backend" a runtime
    resolver 127.0.0.11 valid=10s;

    # Nome del servizio backend nella rete Docker (vedi docker-compose.yml)
    set $backend backend:8000;

    # SPA: qualsiasi path non-API serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Suoni di avviso: il tipo corretto serve ai browser per riprodurli
    location ~* \.wav$ {
        types { }
        default_type audio/wav;
    }

    # Asset statici con hash di build
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebSocket (aggiornamenti live pratiche)
    location ^~ /practices/ws {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API REST — stessi prefissi già usati in vite.config.js per lo sviluppo
    location ~ ^/(auth|practices|events|devices|parks|onboarding|sla|mini|api|static|power|citizen-reports) {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
